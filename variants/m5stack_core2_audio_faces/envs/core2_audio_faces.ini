[env:core2_audio_faces]
extends = env
board = m5stack-core2
build_flags =
    ${env.build_flags}
    -D BOARD_M5STACK_CORE2_AUDIO_FACES
    -D SCREEN_WIDTH=320
    -D SCREEN_HEIGHT=240
    -D BOARD_HAS_PSRAM
    ; ESP32 I2S DMA must come from internal RAM. 8 x 256 is ~8 KiB and
    ; gives 42-46 ms of stereo 16-bit output buffering at 48/44.1 kHz.
    -D AUDIO_I2S_DMA_BUF_COUNT=8
    -D AUDIO_I2S_DMA_BUF_LEN=256
lib_deps =
    ${env.lib_deps}
    m5stack/M5Unified
    https://github.com/m5stack/M5Faces.git
    https://github.com/m5stack/M5Module-Audio.git
